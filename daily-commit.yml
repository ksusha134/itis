name: Daily commit

on:
  schedule:
    - cron: '0 5 * * *'
    - cron: '0 10 * * *'
    - cron: '0 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Make daily update
        run: |
          if [ -s daily.md ]; then
            echo "" >> daily.md
          fi
          echo "Учёба: $(date -u '+%Y-%m-%d %H:%M UTC')" >> daily.md

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily.md
          if ! git diff --cached --quiet; then
            git commit -m "Daily study update"
            git push
          else
            echo "No changes to commit"
          fi
